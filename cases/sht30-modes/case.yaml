schema_version: 1
key: sht30-modes
kind: characterization
intent: |
  SHT30 without a library: soft reset, the status register with its CRC, and a single-shot measurement at each repeatability (high, medium, low) by polling (NACK until ready) and by clock stretching.
targets:
  - {chip: sht30, product: m5stack-u001-c, bus: i2c, addr: "0x44"}
  - {chip: sht30, product: m5stack-u001-b, bus: i2c, addr: "0x44"}
phases:
  - name: soft-reset
    intent: "0x30A2 and the time to the next command"
  - name: status
    intent: "0xF32D then 3 bytes, CRC checked"
  - name: polling-high
    intent: "the read NACKed until the result is ready; tries and time to it (high repeatability)"
  - name: stretch-high
    intent: "the read address ACKed, SCL held low until the result (high repeatability)"
  - name: polling-medium
    intent: "the read NACKed until the result is ready; tries and time to it (medium repeatability)"
  - name: stretch-medium
    intent: "the read address ACKed, SCL held low until the result (medium repeatability)"
  - name: polling-low
    intent: "the read NACKed until the result is ready; tries and time to it (low repeatability)"
  - name: stretch-low
    intent: "the read address ACKed, SCL held low until the result (low repeatability)"
collect:
  lines: [SDA, SCL]
  sketches:
    - {sketch: m5stack/u001-c, number: 3}
    - {sketch: m5stack/u001-b, number: 3}
