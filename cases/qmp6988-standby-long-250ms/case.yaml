schema_version: 1
key: qmp6988-standby-long-250ms
kind: characterization
intent: |
  As qmp6988-standby-long-5ms at standby 250 ms (IO_SETUP 0x60).
targets:
  - {chip: qmp6988, product: m5stack-u001-c, bus: i2c, addr: "0x70"}
phases:
  - name: setup
    intent: "sleep, IIR 4, IO_SETUP, then 200 ms"
  - name: normal
    intent: "F4 0x33 and 2 s of reads every 5 ms"
collect:
  lines: [SDA, SCL]
  sketches:
    - {sketch: m5stack/u001-c, number: 10}
