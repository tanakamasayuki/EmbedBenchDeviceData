schema_version: 1
key: qmp6988-standby-long-5ms
kind: characterization
intent: |
  QMP6988 normal mode for 2 s at standby 5 ms (IO_SETUP 0x20): F4 0x00, 200 ms, F4 0x33 (t x1, p x8, normal), the data read every 5 ms; a line only when the data changes.
targets:
  - {chip: qmp6988, product: m5stack-u001-c, bus: i2c, addr: "0x70"}
phases:
  - name: setup
    intent: "sleep, IIR 4, IO_SETUP, then 200 ms"
  - name: normal
    intent: "F4 0x33 and 2 s of reads every 5 ms"
collect:
  sketch: m5stack/u001-c
  number: 8
  lines: [SDA, SCL]
