schema_version: 1
key: m5unit-env-u001-basic
kind: library
library: m5stack-m5unit-env
intent: |
  How the M5Unit-ENV library (DHT12, BMP280 classes) drives Unit ENV: begin of each part, then three rounds of update 100 ms apart.
targets:
  - {chip: dht12, product: m5stack-u001, bus: i2c, addr: "0x5c"}
  - {chip: bmp280, product: m5stack-u001, bus: i2c, addr: "0x76"}
phases:
  - name: dht12-begin
    intent: "DHT12::begin: what it sends to 0x5c before any measurement"
  - name: bmp280-begin
    intent: "BMP280::begin: what it sends to 0x76 before any measurement"
  - name: dht12-update
    intent: "DHT12::update: the commands and reads for one measurement, and how long it takes"
  - name: bmp280-update
    intent: "BMP280::update: the registers read for one measurement"
collect:
  lines: [SDA, SCL]
  sketches:
    - {sketch: m5stack/u001, number: 2}
