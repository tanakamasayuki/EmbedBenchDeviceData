schema_version: 1
key: qmp6988-measure-bit
kind: characterization
intent: |
  When the measure bit (0xF3 bit 3) rises after a forced CTRL_MEAS write: one status read a set time after the write (0 to 600 us in 20 us steps), each measurement left to end before the next.
targets:
  - {chip: qmp6988, product: m5stack-u001-c, bus: i2c, addr: "0x70"}
phases:
  - name: delay-0us
    intent: "the status read 0 us after CTRL_MEAS forced (the read takes its own bus time on top)"
  - name: delay-20us
    intent: "the status read 20 us after CTRL_MEAS forced (the read takes its own bus time on top)"
  - name: delay-40us
    intent: "the status read 40 us after CTRL_MEAS forced (the read takes its own bus time on top)"
