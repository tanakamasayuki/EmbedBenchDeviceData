schema_version: 1
chip: qmp6988
bus: i2c
addressing:
  pointer_bits: 8
  repeated_start_required: false
  read_auto_increment: true
  evidence: [m5unit-env-u001c-basic__i2c-100k__c553167c6f54e3f4, qmp6988-modes__i2c-100k__b85bde517b61bfb7]
  notes: |
    M5Unit-ENV reads the calibration one byte at a time (pointer A0, A1, ... B8) after a STOP, and
    the measurement from F7 and from FA. The characterization reads F3 for three bytes (F3, F4, F5).
registers:
  - addr: "0xA0"
    width: 25
    name: COE
    access: r
    reset: "52DC0DA7F4820DDC0CD201E6FC86F9C9FAA2F72B0CBB03D8BB"
    per_specimen: true
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7]
    notes: |
      The bench's ENV III env3; the oep-bench ledger names the unit by this value. Read the same in qmp6988-modes and
      m5unit-env-u001c-basic, at 100 and 400 kHz.
  - addr: "0xD1"
    width: 1
    name: CHIP_ID
    access: r
    reset: "5C"
    identifies: true
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7]
  - addr: "0xE0"
    width: 1
    name: RESET
    access: w
    reset: "00"
    notes: E6 resets the part; any other value does nothing (datasheet).
  - addr: "0xF1"
    width: 1
    name: IIR
    access: rw
    reset: "00"
    evidence: [i2cdevicedb-pilot:qmp6988-p0-100k-nominal-0283eb57c7a7c010]
    notes: The OEP run's read of IIR right after a reset failed without reaching the bus.
  - addr: "0xF2"
    width: 1
    name: I2C_SET
    access: rw
    reset: "01"
    evidence: [i2cdevicedb-pilot:qmp6988-p0-100k-nominal-0283eb57c7a7c010]
  - addr: "0xF3"
    width: 1
    name: DEVICE_STAT
    access: r
    reset: "00"
    volatile: true
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7]
  - addr: "0xF4"
    width: 1
    name: CTRL_MEAS
    access: rw
    reset: "00"
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7]
    notes: Reads back what was written, forced mode bits included, after the conversion.
  - addr: "0xF5"
    width: 1
    name: IO_SETUP
    access: rw
    reset: "00"
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7]
  - addr: "0xF7"
    width: 6
    name: DATA
    access: r
    reset: "000000000000"
    volatile: true
    notes: Pressure (3 bytes) then temperature (3 bytes), raw. Read 000000000000 before any conversion (400 kHz run).
    evidence: [qmp6988-modes__i2c-400k__136be8de00714934]
timing:
  - key: conversion
    value_us: "2970 + 855 * (samples_t + samples_p)"
    windows:
      - {setting: "CTRL_MEAS=25 (T x1, P x1)", low_us: 4128, high_us: 4840, evidence: i2cdevicedb-pilot:qmp6988-p0-100k-nominal-0283eb57c7a7c010}
      - {setting: "CTRL_MEAS=31 (T x1, P x8)", low_us: 10646, high_us: 10728, evidence: qmp6988-modes__i2c-400k__136be8de00714934}
    notes: |
      The datasheet's slope (5.5 ms at P x2, T x1 to 33.7 ms at P x32, T x4) through the middle of the P x8 window.
      Its low end: a forced read 10645 us after the write found no data (400 kHz). Its high end: the first normal
      sample of qmp6988-standby-long-5ms__i2c-100k__42c0c43742107c85.
  - key: normal-period
    value_us: "conversion + standby(IO_SETUP bits 7:5)"
    windows:
      - {setting: "CTRL_MEAS=33, IO_SETUP=00 (standby 1 ms)", low_us: 11632, high_us: 11643, evidence: m5unit-env-u001c-basic__i2c-100k__c553167c6f54e3f4}
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7, qmp6988-modes__i2c-400k__136be8de00714934, m5unit-env-u001c-basic__i2c-100k__c553167c6f54e3f4]
    notes: |
      About 11.64 ms at T x1, P x8, standby 1 ms; read every 10 ms, the same value comes back about once in seven
      reads. The window is the library run's 1 s of normal mode with the conversion above.
  - key: standby
    value_us: "IO_SETUP 000: 972, 001: 5391, 010: 45600, 011: 219640, others the datasheet's (unmeasured)"
    windows:
      - {setting: "IO_SETUP=20 (nominal 5 ms)", low_us: 5391, high_us: 5391, evidence: qmp6988-standby-long-5ms__i2c-100k__42c0c43742107c85}
      - {setting: "IO_SETUP=40 (nominal 50 ms)", low_us: 45583, high_us: 45618, evidence: qmp6988-standby-long-50ms__i2c-100k__e2bc048e50fc2277}
      - {setting: "IO_SETUP=60 (nominal 250 ms)", low_us: 219327, high_us: 219951, evidence: qmp6988-standby-long-250ms__i2c-100k__64ea79827dd16f5a}
    notes: |
      The normal period minus the conversion (10665 us at T x1, P x8), fitted over 2 s of reads every 5 ms with the
      first sample at the conversion time; 000 from the normal-period window. Not the datasheet's 1 / 5 / 50 / 250 ms
      in any fixed ratio. The periods are one day's: they are not stable from day to day (earlier runs of the same
      part fitted periods up to 3.5 % shorter), so a model checked against runs of another day needs its own values.
  - key: status-delay
    value_us: "225"
    windows:
      - {setting: "after CTRL_MEAS=31, 400 kHz", low_us: 210, high_us: 226, evidence: qmp6988-measure-bit__i2c-400k__012a3215e73278a3}
    notes: |
      From the start of the CTRL_MEAS write to the start of the status read: 00 up to 209 us, 08 from 226 us
      (a sweep in about 20 us steps). At 100 kHz the earliest read (550 us) already had it.
behaviours:
  - key: forced-then-normal
    evidence: [qmp6988-modes__i2c-400k__136be8de00714934]
    notes: Normal mode written while a forced conversion runs does not restart it; the normal cycle continues from it.
decode_artefacts:
  - key: reset-byte-as-address
    write: "E0E6"
    then: {addr: "0x73", rw: write, bytes: ""}
    cause: unknown
    evidence: [qmp6988-modes__i2c-100k__b85bde517b61bfb7, qmp6988-modes__i2c-400k__136be8de00714934, i2cdevicedb-pilot:qmp6988-p0-100k-nominal-0283eb57c7a7c010]
    notes: |
      Right after E0=E6 (the reset) the wire shows a START with E6 as the address: 0x73 written, refused on the
      P4X (wireskein), ACKed on the pilot's S3 (sigrok). There is no part at 0x73. The decode is right to show it;
      it is not a transfer of its own. Whether the part (resetting while E6 is on the bus) or the controller makes
      the extra frame is not separated yet.
notes: |
  The EmbedBench model is devices/src/qmp6988_model.* (X68); tools/knowledge_table.py writes the
  register table this file describes in its RegTableSpec form.
