notes: |
  Firmware-defined I2C slave: the I2C endpoint is an on-board ESP32-C3 running M5Stack
  firmware (not a fixed-function IC), so the register map is product-specific. The map recorded in
  profiles/ was recovered from the vendor Arduino library source and is marked inferred /
  tentative; a capture is what confirms it. Modeled per-unit. Silicon: ESP32-C3. Used in M5Stack Unit ACSSR (U139) at 0x50.
