notes: |
  Firmware-defined I2C slave: the I2C endpoint is an on-board STM32G030 running M5Stack
  firmware (not a fixed-function IC), so the register map is product-specific. The map recorded in
  profiles/ was recovered from the vendor Arduino library source and is marked inferred /
  tentative; a capture is what confirms it. Modeled per-unit. Silicon: STM32G030. The MCU reads an analog MQ-5 gas sensor via its ADC (not on the I2C bus). Used in M5Stack Unit MQ (U199) at 0x11.
