notes: |
  Photoacoustic CO2 sensor covered by the same datasheet and command set as the SCD41:
  16-bit commands MSB first, 16-bit data words each followed by a CRC-8 byte (poly 0x31,
  init 0xFF). Registered separately from SCD41 because the parts behave differently: SCD40
  covers 400-2000 ppm and has no single-shot command (0x219D), which SCD41 adds. The I2C
  address is fixed at 0x62.
