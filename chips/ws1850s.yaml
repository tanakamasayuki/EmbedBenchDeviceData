schema_version: 1
key: ws1850s
name: WS1850S
manufacturer: WiseSun (Shenzhen Qianhai WiseSun Intelligence Technology)
tags:
- rfid
- nfc
interfaces:
- bus: i2c
  addresses:
  - addr: '0x28'
datasheets:
- source: vendor
  vendor: m5stack
  url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/unit/rfid2/WS1850S%20QFN-32.PDF
  revision: '1.1'
  date: 2018-06
notes: |
  13.56 MHz RFID/NFC reader (ISO/IEC 14443A, MIFARE/NTAG), used at I2C address 0x28. Functionally
  and software-compatible with the NXP MFRC522 register set (the [[mfrc522]] driver works over
  I2C). The datasheet is a M5Stack-hosted copy; WiseSun has no public corporate site hosting it,
  and the same document only otherwise circulates via distributor mirrors (LCSC, JLCPCB).
  M5Stack Unit RFID2 uses it at 0x28, succeeding the MFRC522-based Unit RFID.
