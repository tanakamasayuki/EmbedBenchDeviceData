interfaces:
- bus: i2c
  addresses:
  - addr: '0x29'
    note: default; software-reprogrammable via register 0x8A
datasheets:
- source: manufacturer
  url: https://www.st.com/resource/en/datasheet/vl53l0x.pdf
  revision: Rev 1 (DocID029104)
  date: 2016-05
- source: vendor
  vendor: m5stack
  url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/hat/VL53L0X_en.pdf
  revision: Rev 1 (DocID029104)
  date: 2016-05
notes: |
  Time-of-flight ranging sensor. ST distributes a C API (VL53L0X_*) rather than a full register
  spec: the datasheet documents electricals, timing and the identity registers only. Default
  address 0x29 is software-reprogrammable to run several sensors on one bus (bring up one at a
  time via XSHUT). On the wire the 8-bit form is 0x52 write / 0x53 read. Distinct from the
  VL53L1X (different register set and API), so a separate chip entry. M5Stack Unit ToF uses it
  at 0x29.
