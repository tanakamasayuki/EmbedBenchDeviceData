notes: |
  Firmware-defined I2C slave: the I2C endpoint is an on-board STM32F030 running M5Stack
  firmware (not a fixed-function IC), so the register map is product-specific. The map recorded in
  profiles/ was recovered from the vendor Arduino library source and is marked inferred /
  tentative; a capture is what confirms it. Modeled per-unit. Silicon: STM32F030. The MCU reads a MAX31855 thermocouple converter through an isolator (not on the I2C bus). Used in M5Stack Unit KMeter-ISO (U133-V11) at 0x66.
