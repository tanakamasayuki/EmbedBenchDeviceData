notes: |
  Register map similar to the BME680, with an added AI gas-scanning capability (BME688).
  SDO selects 0x76/0x77. Gas sensing uses a programmable heater profile (res_heat/gas_wait).
  M5Stack Unit ENV-Pro uses it at 0x77.
