notes: |
  2-channel 15-bit I2C DAC (0-5 V / 0-10 V output). The 7-bit address is 10110 followed by the
  A2/A1/A0 pin levels, so eight parts share one bus. Guestgood does not host the datasheet on its
  own site; the M5Stack-hosted copy above (doc FN1601-79.2a) is Guestgood's own PDF mirrored by
  M5Stack. M5Stack Unit DAC2 uses it at 0x59.
