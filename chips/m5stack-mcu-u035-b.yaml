notes: |
  Firmware-defined I2C slave: the I2C endpoint is an on-board ATmega8A running M5Stack
  firmware (not a fixed-function IC), so the register map is product-specific. The map recorded in
  profiles/ was recovered from the vendor Arduino library source and is marked inferred /
  tentative; a capture is what confirms it. Modeled per-unit. Silicon: ATmega8A. Used in M5Stack Unit CardKB v1.1 (U035-B) at 0x5f.
