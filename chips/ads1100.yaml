notes: |
  Single-channel 16-bit self-calibrating ADC. No addressable register map: write one configuration
  byte (ST/BSY, SC, DR1/DR0 data rate, PGA gain) and read 2 data bytes + the config byte back. The I2C address is
  factory-fixed per orderable suffix (ADS1100A0-A7).
