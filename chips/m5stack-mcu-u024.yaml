interfaces:
- bus: i2c
  addresses:
  - addr: '0x52'
datasheets:
- source: vendor
  vendor: m5stack
  url: https://docs.m5stack.com/en/unit/joystick
  kind: product-page
  revision: unstated
notes: |
  Firmware-defined I2C slave: the I2C endpoint is an on-board ATmega328P running M5Stack
  firmware (not a fixed-function IC), so the register map is product-specific and has no
  datasheet. No vendor library covers this unit, so the map has to come from a capture. Modeled per-unit. Silicon: ATmega328P.
  M5Stack publishes no I2C protocol document for this generation, so the register map is
  known only from the vendor example code and must be confirmed from captures. The
  successor U024-C (Joystick v1.1) uses an ATmega8A at the same address.
  Used in M5Stack Unit Joystick (U024) at 0x52.
