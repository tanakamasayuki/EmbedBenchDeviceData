- gyroscope
interfaces:
- bus: i2c
  addresses:
  - addr: '0x68'
    note: SDO=GND
  - addr: '0x69'
    note: SDO=VDD
datasheets:
- source: manufacturer
  url: https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmi270-ds000.pdf
