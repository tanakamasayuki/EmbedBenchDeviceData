notes: |
  Firmware-defined I2C slave: the I2C endpoint is an on-board STM32G031 running M5Stack
  firmware (not a fixed-function IC), so the register map is product-specific. The map recorded in
  profiles/ was recovered from the vendor Arduino library source and is marked inferred /
  tentative; a capture is what confirms it. Modeled per-unit. Silicon: STM32G031. Used in M5Stack Unit Step16 (U198) at 0x48.
