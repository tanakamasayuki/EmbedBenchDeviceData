schema_version: 1
key: pca9548a
name: PCA9548A
manufacturer: NXP
tags:
- i2c-mux
- i2c-switch
interfaces:
- bus: i2c
  addresses:
  - addr: '0x70'
    note: A2=GND A1=GND A0=GND (base)
  - addr: '0x71'
    note: A2=GND A1=GND A0=VDD
  - addr: '0x72'
    note: A2=GND A1=VDD A0=GND
  - addr: '0x73'
    note: A2=GND A1=VDD A0=VDD
  - addr: '0x74'
    note: A2=VDD A1=GND A0=GND
  - addr: '0x75'
    note: A2=VDD A1=GND A0=VDD
  - addr: '0x76'
    note: A2=VDD A1=VDD A0=GND
  - addr: '0x77'
    note: A2=VDD A1=VDD A0=VDD
