notes: |
  Outputs eCO2 (ppm) then TVOC (ppb). After iaq_init the first ~15 s returns fixed defaults
  (400 ppm / 0 ppb); measure_air_quality must be called at 1 s intervals to maintain the baseline
  algorithm. Fixed address 0x58. M5Stack Unit Mini TVOC/eCO2 uses it at 0x58.
