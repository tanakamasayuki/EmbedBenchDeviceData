notes: |
  Single-channel 12-bit DAC with an on-board EEPROM holding the power-on default. Device code is
  fixed 1100, followed by A2/A1 (factory-programmed per orderable variant) and A0 (pin).
  M5Stack Unit DAC uses 0x60 (0-3.3 V).
