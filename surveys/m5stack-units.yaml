notes: |
  products/ holds every SKU of this line, whether or not it carries an I2C device; each entry
  says with interfaces what its unit actually speaks. So this file no longer records exclusions.
  What it still records is the sweep itself: where the line was enumerated from, and which pages
  under that URL space belong to a different line, so that a later sweep does not triage them
  again and "absent from products/" stays unambiguous.
  pending is for a SKU of this line that has been found but not yet classified. It is empty.
  Evidence for a classification is the product page's pin map, which names UART_RX / UART_TX,
  CAN_TX / CAN_RX, an analog output or a plain digital signal where there is no I2C bus. Two
  traps are worth remembering: M5Stack labels Grove Port A pins SDA / SCL even when a Unit
  drives them as plain GPIO (Unit Ultrasonic-IO), and an ESP32-based board exposes SDA / SCL as
  a master, which makes it a host rather than a target.
  page is the slug under https://docs.m5stack.com/en/unit/ (slugs may contain spaces).
