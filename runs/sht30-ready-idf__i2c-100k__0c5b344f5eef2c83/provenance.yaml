schema_version: 1
case: sht30-ready-idf
date: 2026-10-30
targets:
  - {chip: sht30, product: m5stack-u001-c, bus: i2c, addr: "0x44"}
bus:
  kind: i2c
  hz: 100000
  pins:
    SDA: 14
    SCL: 15
  pullups: unknown (only Unit ENV III on the Grove; none added on the board side)
dut:
  board: ESP32-P4X (Unit ENV III on its Grove GPIO14 / 15)
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  core:
    name: arduino-esp32
    version: 3.3.12
  controller: esp32p4
probe:
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  firmware: oep-probe-arduino
  version: 3feb4e2
wireskein:
  version: 45261b2
captures:
  - file: c0001.wireskein
    decode: c0001.i2c.json
    timebase:
      tick_hz: [2000000, 1]
      tick0: 0
      start_ns: 7554153500
notes: |
  Captured at 2 MHz. power-on here is the first command since the probe's boot, not since the part's power-on
  (sht30-ready's run has that). Reset +0 ms: the 0x2400 was NACKed (transmit 259), no answer. Reset +2 / +10 / +100 ms
  and after a read measurement: the answer at 12.5 ms. After a measurement left unread: the first read (4 us after the
  new command) got a result with a good CRC at once, and the new measurement came at 12.5 ms - the unread result is kept
  and handed to the next read. With no command, no read was answered.
  c0001.analysis.json is wireskein decode (wireskein-analysis/1); c0001.i2c.json is its transactions.
