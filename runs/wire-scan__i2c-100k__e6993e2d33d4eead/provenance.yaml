schema_version: 1
case: wire-scan
date: 2026-10-30
targets:
  - {chip: sht30, product: m5stack-u001-c, bus: i2c, addr: "0x44", bench: {name: env3, position: "3-3 / 3-4"}}
  - {chip: qmp6988, product: m5stack-u001-c, bus: i2c, addr: "0x70", bench: {name: env3, position: "3-3 / 3-4"}}
bus:
  kind: i2c
  hz: 100000
  pins:
    SDA: 14
    SCL: 15
  pullups: unknown (only Unit ENV III on the Grove; none added on the board side)
dut:
  board: ESP32-P4X (Unit ENV III on its Grove GPIO14 / 15)
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  core:
    name: arduino-esp32
    version: 3.3.12
  controller: esp32p4
probe:
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  firmware: oep-probe-arduino
  version: 3feb4e2
wireskein:
  version: 45261b2
captures:
  - file: c0001.wireskein
    decode: c0001.i2c.json
    timebase:
      tick_hz: [2000000, 1]
      tick0: 0
      start_ns: 59384099000
notes: |
  On the wire only 0x44 and 0x70 ACK. Wire reported 61 addresses found: after an address NACK, the next endTransmission often returned 0 with nothing on the wire (arduino-esp32 3.3.12 on the ESP32-P4). The decoded transfers, not the found lines, are what the bus did.
  c0001.analysis.json is the same capture decoded by wireskein decode (wireskein-analysis/1); c0001.i2c.json is its
  transactions. The DUT is the probe itself (EnvCases.cpp beside the OEP firmware).
