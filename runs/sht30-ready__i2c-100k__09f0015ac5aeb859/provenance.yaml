schema_version: 1
case: sht30-ready
date: 2026-10-30
targets:
  - {chip: sht30, product: m5stack-u001-c, bus: i2c, addr: "0x44", bench: {name: env3, position: "3-3 / 3-4"}}
bus:
  kind: i2c
  hz: 100000
  pins:
    SDA: 14
    SCL: 15
  pullups: unknown (only Unit ENV III on the Grove; none added on the board side)
dut:
  board: ESP32-P4X (Unit ENV III on its Grove GPIO14 / 15)
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  core:
    name: arduino-esp32
    version: 3.3.12
  controller: esp32p4
probe:
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  firmware: oep-probe-arduino
  version: 3feb4e2
wireskein:
  version: 45261b2
captures:
  - file: c0001.wireskein
    decode: c0001.i2c.json
    timebase:
      tick_hz: [2000000, 1]
      tick0: 0
      start_ns: 82021701500
notes: |
  Captured at 2 MHz. The unit's cable had just been unplugged and plugged back (SHT30 held SCL low after an abandoned
  stretch read): power-on is the first command after that. Wire's lines are not the wire's: after a NACKed poll Wire
  sometimes returns 6 bytes of a stale buffer (000000..., 262626..., 424242...) and skips the next transfer, so some
  soft resets and commands never reached the part. On the wire: power-on answered 12.56 ms after 0x2400; after reset
  +10 / +100 ms, 12.55 / 12.56 ms; at reset +2 ms the 0x2400 did not reach the wire and every read got 00 00 81 FF FF FF
  (word 0x0000 with its CRC, then FF).
  c0001.analysis.json is wireskein decode (wireskein-analysis/1); c0001.i2c.json is its transactions.
