notes: |
  Captured at 2 MHz. ESP-IDF with scl_wait_us 20000: SCL held 11.7 ms, 6 bytes, CRC good (12.5 ms for the receive). Wire with setTimeOut(1000): still 0 bytes after 6.7 ms; the give-up is the driver's SCL wait, not Wire's timeout. The read Wire abandoned left SHT30 holding the bus (end_cond none): the 400 kHz attempts after it
  found SCL held low from start to end (not kept here).
  c0001.analysis.json is wireskein decode (wireskein-analysis/1); c0001.i2c.json is its transactions.
