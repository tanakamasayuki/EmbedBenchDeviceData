schema_version: 1
case: qmp6988-modes
date: 2026-10-30
targets:
  - {chip: qmp6988, product: m5stack-u001-c, bus: i2c, addr: "0x70"}
bus:
  kind: i2c
  hz: 100000
  pins:
    SDA: 14
    SCL: 15
  pullups: unknown (only Unit ENV III on the Grove; none added on the board side)
dut:
  board: ESP32-P4X (Unit ENV III on its Grove GPIO14 / 15)
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  core:
    name: arduino-esp32
    version: 3.3.12
  controller: esp32p4
probe:
  id: usb:80f1b2d719c5
  bench: {name: p4x-grove, position: "3-3 / 3-4"}
  firmware: oep-probe-arduino
  version: 3feb4e2
wireskein:
  version: 45261b2
captures:
  - file: c0001.wireskein
    decode: c0001.i2c.json
    timebase:
      tick_hz: [2000000, 1]
      tick0: 0
      start_ns: 99744744500
notes: |
  Normal mode: the data changes about every 10 ms after the first 20 ms.
  After the soft reset (0xE6 to 0xE0) the wire shows the register byte ACKed and a STOP, then a START with 0xE6 as
  the address (0x73, NACK), then nothing for 60 ms; the IIR read that followed returned 0 bytes with nothing on the
  wire. Whether the part or the controller made the extra frame is not separated here.
  c0001.analysis.json is the same capture decoded by wireskein decode (wireskein-analysis/1); c0001.i2c.json is its
  transactions. The DUT is the probe itself (EnvCases.cpp beside the OEP firmware).
