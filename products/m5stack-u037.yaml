notes: |
  ESP32 + OV2640 fisheye camera board. The Grove pins are the on-board ESP32's own master-side
  signals; the 0x68 / 0x76 footprints on the schematic are unpopulated options.
  The vendor documents this SKU on two pages: the older /en/unit/m5camera_f (M5Camera-F) and the
  one linked here (M5Camera-F New, 150 degree lens). url points at the newer one because a SKU
  gets one entry.
