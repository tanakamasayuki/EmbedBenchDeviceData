schema_version: 1
key: m5stack-u139
name: Unit ACSSR
vendor: m5stack
sku: U139
connector: HY2.0-4P (Grove)
url: https://docs.m5stack.com/en/unit/ACSSR
interfaces:
- i2c
- uart
components:
- chip: m5stack-mcu-u139
  bus: i2c
  addr: '0x50'
notes: |
  Three modes chosen by the on-board button: button-only, I2C target on the Grove port, or
  Modbus RTU over RS485 on the two HT3.96-4P terminals. Only the I2C mode is in scope here.
