profiles:
  esp32p4x:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc,ChipVariant=postv3,PSRAM=enabled
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - OpenEmbeddedProbe (0.0.54)
      - EspUsbDevice (3.2.0)
      - VL53L0X (1.3.1)
      - dir: ../../libraries/ProbeCases
      - dir: ../../libraries/DeviceCases
default_profile: esp32p4x
