[project]
name = "embedbench-device-data-collect"
version = "0"
description = "Collection of EmbedBenchDeviceData's runs on an OEP probe, run with pytest"
requires-python = ">=3.11"
# Pinned so a run says what took it; raise them deliberately (oep-client-python is 0.0.x and may break before v1).
dependencies = [
    "pytest-embedded-arduino-cli==1.11.0",
    "oep-client-python[usb-async]==0.0.54",
    "wireskein==0.0.27",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# A collection runs only when its .py is named on the command line (its files carry no test_ prefix).
python_files = []
